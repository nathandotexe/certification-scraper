# © AngelaMos | 2026
# .github/workflows/scrape.yml
#
# Runs CertScout on a schedule so the report stays fresh without anyone's
# machine needing to be on. Produces two datasets each run — global and
# Indonesia-filtered — commits the refreshed output/ + README.md back to the
# repo, and archives a monthly CSV snapshot of each under site/history/ for
# the download page served by Vercel.

name: Scrape cybersecurity certification demand

on:
  schedule:
    # 06:00 UTC every Monday. Edit the cron expression to change cadence.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated sources (workday,greenhouse,lever,ashby,remoteok,usajobs,adzuna)"
        required: false
        default: "workday,greenhouse"
      target:
        description: "Cap on cybersecurity postings to analyze (or 'all')"
        required: false
        default: "12000"
      top:
        description: "Number of certifications in the report"
        required: false
        default: "12"
      indonesia_terms:
        description: "Comma-separated location match terms for the Indonesia cut"
        required: false
        default: "indonesia,jakarta,bali,surabaya,bandung,yogyakarta,denpasar,medan,semarang,makassar,malang"

permissions:
  contents: write

concurrency:
  group: certscout-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
      USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      SOURCES: ${{ github.event.inputs.sources || 'workday,greenhouse' }}
      TARGET: ${{ github.event.inputs.target || '12000' }}
      TOP: ${{ github.event.inputs.top || '12' }}
      INDONESIA_TERMS: ${{ github.event.inputs.indonesia_terms || 'indonesia,jakarta,bali,surabaya,bandung,yogyakarta,denpasar,medan,semarang,makassar,malang' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile

      - name: Run global scrape
        run: |
          mix run -e 'CertScout.CLI.main(System.argv())' -- \
            --sources "$SOURCES" --target "$TARGET" --top "$TOP" --output output

      - name: Run Indonesia-filtered scrape
        run: |
          mix run -e 'CertScout.CLI.main(System.argv())' -- \
            --sources "$SOURCES" --target "$TARGET" --top "$TOP" \
            --location "$INDONESIA_TERMS" --output output/indonesia

      - name: Sync README with latest global report
        run: cp output/REPORT.md README.md

      - name: Archive monthly snapshot and rebuild manifest
        run: bash scripts/archive_month.sh

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output README.md site
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: scheduled scrape refresh ($(date -u +'%Y-%m-%d'))"
            git push
          fi
